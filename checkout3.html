<!DOCTYPE html>
<html lang="en-IN">
<head>

<title>Add new card - Etsy India</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f9f7f4;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:#222;min-height:100vh}
.top{display:flex;justify-content:center;align-items:center;gap:6px;padding:36px 0 26px}
.top span{font-size:12px;font-weight:700;color:#595959}
.card{width:min(94vw,600px);margin:0 auto 40px;background:#fff;border-radius:24px;overflow:hidden}
.inner{padding:36px 40px 28px}
h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 28px}
label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
label b{color:#c8102e;margin-left:4px}
.f{margin-bottom:20px}
input,select{width:100%;height:48px;border:1px solid #767676;border-radius:10px;padding:0 14px;font-size:15px;font-family:inherit;background:#fff;color:#222}
input:focus,select:focus{outline:2px solid #222;outline-offset:1px}
.bad{border-color:#c8102e!important}
.err{color:#c8102e;font-size:12px;margin-top:4px;display:none}
.row{display:flex;gap:16px}.row>div{flex:1}
.prog{display:flex;gap:2px;height:3px;background:#fff}
.prog i{flex:1;background:#dedad6;display:block}.prog i.on{background:#222}
.foot{display:flex;justify-content:space-between;align-items:center;padding:18px 40px 28px}
.btn{border:none;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.g{background:#f1eeeb;color:#222}.btn.d{background:#2b2528;color:#fff}
</style>

<div class="card">
<div class="inner"><h1>Add new card</h1>
<style>
.cn{position:relative}.cn input{padding-left:38px;padding-right:38px}
.cn .l,.cn .r{position:absolute;top:50%;transform:translateY(-50%);font-size:14px;color:#222}.cn .l{left:12px}.cn .r{right:12px}
.bill{border:1px solid #dedad6;border-radius:12px;padding:16px 18px;margin-top:4px}
.bill b{display:block;font-size:13px;margin-bottom:8px}.bill span{font-size:14px}
#done{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
#done div{background:#fff;border-radius:24px;padding:32px 28px;text-align:center;width:min(90vw,360px)}
#done h2{margin:0 0 8px;font-size:18px}#done p{margin:0 0 20px;font-size:13px;color:#595959}
</style>
<div class="f"><label for="cardno">Card number</label><div class="cn"><span class="l">&#9645;</span><input id="cardno" inputmode="numeric" maxlength="19" autocomplete="off"><span class="r">&#128274;</span></div></div>
<div class="row f"><div><label for="exp">Expiration date</label><input id="exp" placeholder="MM/YY" maxlength="5" inputmode="numeric" autocomplete="off"></div>
<div><label for="cvv">Security code <span title="The 3 or 4 digits on your card">&#9432;</span></label><input id="cvv" inputmode="numeric" maxlength="4" autocomplete="off"></div></div>
<div class="f"><label for="cname">Name on card</label><input id="cname"></div>
<div class="bill"><b>Billing address</b><span id="bill"></span></div>
<div class="err" id="msg">Please check your card details.</div>
<div id="done"><div><h2>Order placed &#10003;</h2><p>Thank you! This is a demo, so no payment was taken.</p><button class="btn d" id="home">Back to home</button></div></div>
</div>
<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i></div>
<div class="foot"><button class="btn g" id="back">Back</button><button class="btn d" id="next">Continue</button></div>
</div>
<script>
var a={};try{a=JSON.parse(sessionStorage.getItem('checkoutAddress')||'{}');}catch(e){}
if(!a.street)location.replace('checkout1.html');
var line=[a.street,a.apt,(a.city||'').toUpperCase()+' '+a.pin,a.state,a.phone].filter(Boolean).join(', ');
document.getElementById('bill').textContent=line;
document.getElementById('cname').value=(a.name||'').toUpperCase();
var no=document.getElementById('cardno'),ex=document.getElementById('exp'),cv=document.getElementById('cvv');
no.oninput=function(){no.value=no.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();};
ex.oninput=function(){var v=ex.value.replace(/\D/g,'').slice(0,4);ex.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v;};
cv.oninput=function(){cv.value=cv.value.replace(/\D/g,'');};
document.getElementById('back').onclick=function(){location.href='checkout2.html';};
document.getElementById('next').onclick=function(){
  var m=+ex.value.slice(0,2),bad={};
  bad.cardno=no.value.replace(/\s/g,'').length<13;
  bad.exp=!/^\d\d\/\d\d$/.test(ex.value)||m<1||m>12;
  bad.cvv=cv.value.length<3;
  bad.cname=!document.getElementById('cname').value.trim();
  var any=false;Object.keys(bad).forEach(function(k){document.getElementById(k).classList.toggle('bad',bad[k]);if(bad[k])any=true;});
  document.getElementById('msg').style.display=any?'block':'none';
  if(any)return;
  var CAT={ferrara:{t:'CROCHET PATTERN FERRARA Light Bag',p:471,s:'isWoolish',img:'https://i.etsystatic.com/8878834/r/il/cf6296/6485116257/il_340x270.6485116257_cum3.jpg'},
    vera:{t:'CROCHET PATTERN VERA Bag',p:471,s:'Etsy seller',img:'https://i.etsystatic.com/8878834/r/il/cf6296/6485116257/il_340x270.6485116257_cum3.jpg'},triangle:{t:'Triangle Crochet Bag Pattern',p:887,s:'Etsy seller',img:'https://i.etsystatic.com/8878834/r/il/af8450/6485112261/il_340x270.6485112261_4zyu.jpg'},
    loma:{t:'Loma Bag crochet pattern',p:557,s:'Etsy seller',img:'https://i.etsystatic.com/8878834/r/il/d22f08/6437010844/il_340x270.6437010844_exm7.jpg'},hand:{t:'Crochet Hand and Shoulder Bag',p:567,s:'Etsy seller',img:'https://i.etsystatic.com/8878834/r/il/af162b/6485112531/il_340x270.6485112531_xf30.jpg'},
    tote:{t:'Crochet Tote Bag Pattern',p:491,s:'Etsy seller',img:'https://i.etsystatic.com/8878834/r/il/d46d30/6437011252/il_340x270.6437011252_hhkf.jpg'}};
  var ids=[];try{ids=JSON.parse(sessionStorage.getItem('cartItems')||'[]');}catch(e){}
  var order={no:'#3021-'+Math.floor(1000000+Math.random()*8999999),ts:Date.now(),address:a,
    items:ids.filter(function(i){return CAT[i];}).map(function(i){return CAT[i];})};
  sessionStorage.setItem('lastOrder',JSON.stringify(order));
  sessionStorage.removeItem('cartItems');
  location.href='order-confirmation.html';
};
</script>
